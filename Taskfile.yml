version: '3'

tasks:
    # --- Install ---
    install:
        aliases: [i]
        desc: Install dependencies
        cmd: npm install

    # --- Build ---
    build:
        aliases: [b]
        desc: Compile TypeScript
        cmd: npx tsc

    # --- Tests ---
    test:
        aliases: [t]
        desc: Run all tests
        deps: [build]
        cmd: npx mocha

    test-api:
        aliases: [ta]
        desc: Run API tests only
        deps: [build]
        cmd: npx mocha --spec 'dist/test/api/**/*.spec.js'

    test-soap:
        aliases: [tsoap]
        desc: Run SOAP tests only
        deps: [build]
        cmd: npx mocha --spec 'dist/test/soap/**/*.spec.js'

    test-regression:
        aliases: [tr]
        desc: Run regression tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/api/regression/**/*.spec.js'

    test-smoke:
        aliases: [tsm]
        desc: Run smoke tests
        deps: [build]
        cmd: npx mocha --spec 'dist/test/api/smoke/**/*.spec.js'

    # --- Code quality ---
    lint:
        aliases: [l]
        desc: Run ESLint
        cmd: npx eslint .

    lint-fix:
        aliases: [lf]
        desc: Run ESLint with auto-fix
        cmd: npx eslint . --fix

    format:
        aliases: [fmt]
        desc: Format code with Prettier
        cmd: npx prettier --write .

    format-check:
        aliases: [fc]
        desc: Check formatting with Prettier (CI)
        cmd: npx prettier --check .

    # --- Allure report ---
    report:
        aliases: [r]
        desc: Run tests and generate Allure report
        cmds:
            - task: build
            - cmd: npx mocha --reporter allure-mocha --reporter-option resultsDir=allure-results
            - cmd: allure generate allure-results --clean -o allure-report
            - cmd: allure open allure-report
